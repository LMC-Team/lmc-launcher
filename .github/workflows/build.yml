# LMC Launcher CI：构建 APK（含 liblmc_core.so）
# 触发：push 到 main / 手动 / PR
# 运行环境：ubuntu-latest 自带 JDK 与 Android SDK 基础组件
name: build-apk

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 NDK 与 CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: 构建 APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: lmc-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 可选任务：构建 Mesa/Zink+Turnip 运行时（耗时约 40 分钟，手动触发才运行）
      - name: 构建 Mesa 运行时（仅 workflow_dispatch）
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update && sudo apt-get install -y meson ninja-build flex bison python3-mako
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" ./scripts/build_mesa.sh
